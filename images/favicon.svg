<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8743b"/>
      <stop offset="100%" style="stop-color:#d4a24e"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Bridge arch -->
  <path d="M10 44 Q32 14 54 44" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Bridge deck -->
  <line x1="8" y1="46" x2="56" y2="46" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Cables -->
  <line x1="18" y1="36" x2="18" y2="46" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>
  <line x1="26" y1="26" x2="26" y2="46" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>
  <line x1="32" y1="22" x2="32" y2="46" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>

  <line x1="46" y1="36" x2="46" y2="46" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>
  <!-- Bread on bridge -->
  <ellipse cx="22" cy="42" rx="5" ry="3.5" fill="#fff" opacity=".5"/>
  <path d="M18 42 Q22 37 26 42" fill="#fff" opacity=".35"/>
  <!-- Heart above -->
